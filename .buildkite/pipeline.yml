env:
  CI: "1"

steps:
  - label: ":flutter: Analyze and test packages"
    command: |
      set -euo pipefail
      export ANDROID_HOME=/opt/homebrew/share/android-commandlinetools
      export ANDROID_SDK_ROOT="$ANDROID_HOME"
      flutter_launcher="$(realpath "$(command -v flutter)")"
      export FLUTTER_ROOT="$(cd "$(dirname "$flutter_launcher")/.." && pwd)"
      flutter_tool_config="$(mktemp "${TMPDIR:-/tmp}/nuxie-flutter-tool.XXXXXX")"
      trap 'unlink "$flutter_tool_config"' EXIT
      sed \
        "s#\"rootUri\": \"../\"#\"rootUri\": \"file://$FLUTTER_ROOT/packages/flutter_tools\"#" \
        "$FLUTTER_ROOT/packages/flutter_tools/.dart_tool/package_config.json" \
        > "$flutter_tool_config"
      flutter_tool=(
        "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart"
        --packages="$flutter_tool_config"
        "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"
        --no-version-check
      )
      for package in packages/*; do
        [[ -f "$package/pubspec.yaml" ]] || continue
        (
          cd "$package"
          "${flutter_tool[@]}" pub get
          "${flutter_tool[@]}" analyze
          if [[ -d test ]]; then
            "${flutter_tool[@]}" test
          fi
        )
      done
    agents:
      queue: nuxie-pr
      nuxie-platform: macos
    timeout_in_minutes: 90
    retry:
      automatic:
        - exit_status: -1
          limit: 1
