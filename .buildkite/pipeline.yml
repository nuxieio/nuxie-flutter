env:
  CI: "1"

steps:
  - label: ":flutter: Analyze and test packages"
    command: |
      set -euo pipefail
      export ANDROID_HOME=/opt/homebrew/share/android-commandlinetools
      export ANDROID_SDK_ROOT="$ANDROID_HOME"
      for package in packages/*; do
        [[ -f "$package/pubspec.yaml" ]] || continue
        (
          cd "$package"
          flutter pub get
          flutter analyze
          if [[ -d test ]]; then
            flutter test
          fi
        )
      done
    agents:
      queue: nuxie-pr
      nuxie-platform: macos
    timeout_in_minutes: 90
    retry:
      automatic:
        - exit_status: -1
          limit: 1
